# docker-compose up -d
# IMPORTANT: Set these environment variables before running:
# - MYSQL_ROOT_PASSWORD
# - REDIS_PASSWORD
# Example: export MYSQL_ROOT_PASSWORD=your_secure_password

version: '3'

services:
  db:
    container_name: store3d_db
    #image: mariadb:10.11
    image: mysql:8.0.26
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}  # Set via environment variable
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store3d}
      #MYSQL_USER: user
      #MYSQL_PASSWORD: password
      MYSQL_ROOT_HOST: '%' # allow root login from anywhere
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - store3d-net
    ports:
      - "3306:3306"
  redis:
    container_name: store3d_redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-changeme}
    volumes: 
      - redis-data:/data
    networks:
      - store3d-net

  backend:
    container_name: store3d_backend
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_TYPE: mysql
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      DB_DATABASE_NAME: ${MYSQL_DATABASE:-store3d}
      DB_POOL_RECYCLE: 3600
      DB_POOL_SIZE: 50
      DB_POOL_TIMEOUT: 30
      DB_POOL_MAX_OVERFLOW: 60
      CACHE_TYPE: RedisCache
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
      CACHE_REDIS_DB: 0
      CACHE_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      #CACHE_REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: true
      SCHEDULER_MODE: redis
      SCHEDULER_TIMEZONE: Asia/Muscat
      SCHEDULER_REDIS_HOST: redis
      SCHEDULER_REDIS_PORT: 6379
      SCHEDULER_REDIS_DB: 1
      SCHEDULER_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      RATELIMIT_STORAGE_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/2
      # Security - These MUST be set via environment variables
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:?SECURITY_PASSWORD_SALT must be set}

    depends_on:
      - db
      - redis
    #volumes:
    #  - store3d/uploads:/home/store3d/uploads
    networks:
      - store3d-net
networks:
  store3d-net:
volumes:
  db-data:
  redis-data:
