components:
  schemas:
    PaymentTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active:
          type: boolean
        requester:
          type: string
        reference_id:
          type: string
        gateway_transaction_id:
          type: string
          format: date-time
        payment_status:
          type: string
          description: Payment Status
          enum:
          - none
          - pending
          - cancel
          - error
          - fail
          - success
        amount:
          type: number
          format: float
        vat:
          type: number
          format: float
        model_type:
          type: string
        model_id:
          type: integer
          format: int64
        response_code:
          type: string
        response_decision:
          type: string
        card_number:
          type: string
        card_expiry_date:
          type: string
        note:
          type: string
        retry:
          type: integer
          format: int64
        dump_response:
          type: string
        custom_properties:
          type: string
          format: JSON
        create_date:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
        payment_gateway:
          type: string
        payment_type:
          type: string

    PaymentConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        payment_gateway:
          type: string
        fee: 
          type: number
          format: float
        fee_cap: 
          type: number
          format: float
        limit: 
          type: number
          format: float
        is_default:
          type: boolean
        url:
          type: string
        access_key:
          type: string
        secret_key:
          type: string
        merchant_key1:
          type: string
        merchant_key2:
          type: string
        merchant_key3:
          type: string
        merchant_key4:
          type: string
        merchant_key5:
          type: string
    PaymentGateway:
      type: object
      properties:
        name:
          type: string
    filter:
      type: object
      properties:
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        sort:
          type: string
        sort_order:
          type: string
          enum:
              - asc
              - desc
        queries:
          type: string
          description: field,operator,value _exp_ | name,eq,mazoman&email,eq,info@mazoman.com|, opernation| eq,ne,lt,gt,le,ge,like |

    Global:
      required:
      #- code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Error:
      required:
      #- code
      - message
      type: object
      properties:
        #code:
        #  type: string
        message:
          type: string
          example: Authorization information is missing or invalid.
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    JWT:
      type: apiKey
      name: x-access-tokens
      in: header
