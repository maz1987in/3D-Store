      description: This can only be done by the logged in user.
      operationId: updatePayment
      parameters:
      - name: paymentId
        in: path
        description: ID that need to be updated
        required: true
        schema:
          type: string
      requestBody:
        description: Updated payment object
        content:
          application/json:
