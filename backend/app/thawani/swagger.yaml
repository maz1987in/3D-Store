openapi: 3.0.1
info:
  title: Store3d API
  description: This is an Store3d API document
  contact:
    email: info@store3d.om
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: https://store3d-api.example.com/store3d/api/v1
- url: /store3d/api/v1
security:
- basicAuth: []
- JWT: []
tags:
- name: thawani
  description: Operations about Thawani

paths:
  /thawanis/:
    post:
      tags:
      - thawani
      summary: Create thawani session
      description: This can only be done by the logged in user.
      operationId: CreateThawani
      requestBody:
        description: Create thawani object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store3dtThawani'
        required: true
      responses:
        201:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
  /thawanis/payment_status/{session_id}:
    get:
      tags:
      - thawani
      summary: Get thawani payment status
      description: This can only be done by the logged in user.
      operationId: getThawaniById
      parameters:
      - name: id
        in: path
        description: The id that needs to get
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content: {}
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
  
components:
  schemas:
    Store3dtThawani:
      type: object
      properties:
        client_reference_id:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        metadata: # needed to be {key: value} pair
          type: object
          properties:
            key:
              type: string
              example: value

    Product:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: number
        unit_amount:
          type: number


    Global:
      required:
      #- code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Error:
      required:
      #- code
      - message
      type: object
      properties:
        #code:
        #  type: string
        message:
          type: string
          example: Authorization information is missing or invalid.
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    JWT:
      type: apiKey
      name: x-access-tokens
      in: header
