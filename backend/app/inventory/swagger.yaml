openapi: 3.0.1
info:
  title: Store3d API
  description: This is an Store3d API document
  contact:
    email: info@store3d.om
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: https://store3d-api.example.com/store3d/api/v1
- url: /store3d/api/v1
security:
- basicAuth: []
- JWT: []
tags:
- name: inventory
  description: Operations about Inventory

paths:
  /inventories/:
    get:
      tags:
      - inventory
      summary: Get All Inventorys
      description: This can only be done by the logged in user.
      operationId: GetInventorys
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory'
        401:
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - inventory
      summary: Create inventory
      description: This can only be done by the logged in user.
      operationId: CreateInventory
      requestBody:
        description: Create inventory object
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Store3dtInventory'
        required: true
      responses:
        201:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
  /inventories/{id}:
    get:
      tags:
      - inventory
      summary: Get inventory
      description: This can only be done by the logged in user.
      operationId: getInventoryById
      parameters:
      - name: id
        in: path
        description: The id that needs to get
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - inventory
      summary: Delete inventory
      description: This can only be done by the logged in user.
      operationId: delete_inventory
      parameters:
      - name: id
        in: path
        description: The id that needs to be deleted
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - inventory
      summary: Updated Inventory
      description: This can only be done by the logged in user.
      operationId: update_inventory
      parameters:
      - name: id
        in: path
        description: ID that need to be updated
        required: true
        schema:
          type: string
      requestBody:
        description: Updated inventory object
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Store3dtInventory'
        required: true
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
  
components:
  schemas:
    Inventory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        create_date:
          type: string
          format: date-time
        modified_date:
          type: string
          format: date-time
    
    Store3dtInventory:
      type: object
      properties:
        location:
          type: string
        product_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32

    Global:
      required:
      #- code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Error:
      required:
      #- code
      - message
      type: object
      properties:
        #code:
        #  type: string
        message:
          type: string
          example: Authorization information is missing or invalid.
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    JWT:
      type: apiKey
      name: x-access-tokens
      in: header
