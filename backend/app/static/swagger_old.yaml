components:
  schemas:
    Signup:
      type: object
      properties:
        phone:
          type: integer
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        is_active:
          type: boolean
        phone:
          type: integer
        email:
          type: string
          format: email
        mobile_confirmed_at:
          type: string
          format: date-time
        email_confirmed_at:
          type: string
          format: date-time
    PaymentTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active:
          type: boolean
        requester:
          type: string
        reference_id:
          type: string
        transaction_id:
          type: string
          format: date-time
        payment_status:
          type: string
          description: Payment Status
          enum:
          - none
          - pending
          - cancel
          - error
          - fail
          - success
        amount:
          type: number
          format: float
        vat:
          type: number
          format: float
        model_type:
          type: string
        model_id:
          type: integer
          format: int64
        response_code:
          type: string
        response_decision:
          type: string
        card_number:
          type: string
        card_expiry_date:
          type: string
        note:
          type: string
        dump_response:
          type: string
        custom_properties:
          type: string
          format: JSON
        create_date:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
        payment_gateway:
          type: string
        payment_type:
          type: string
    Media:
      type: object
      properties:
        id:
          type: integer
          format: int64
        model_type:
          type: string
          example: users
        model_id:
          type: integer
          format: int64
        collection_name:
          type: string
        name:
          type: string
        mime_type:
          type: string
        disk:
          type: string
        size:
          type: string
        order_column:
          type: integer
          format: int32
        upload_file:
          type: string
        custom_properties:
          type: string
          format: JSON
        create_date:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
    Setting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        category:
          type: string
        last_modified:
          type: string
          format: date-time
    UserNotification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        user_id:
          type: integer
          format: int64
        read:
          type: boolean
        timestamp:
          type: string
          format: date-time
        message:
          type: string
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enable:
          type: boolean
        timestamp:
          type: string
          format: date-time
        order:
          type: integer
        name:
          type: object
          properties:
            ar:
              type: string
            en:
              type: string
        content:
          type: object
          properties:
            ar:
              type: string
            en:
              type: string
    filter:
      type: object
      properties:
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        sort:
          type: string
        sort_order:
          type: string
          enum:
              - asc
              - desc
        queries:
          type: string
    
    JWTToken:
      type: object
      properties:
        token:
          type: string
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: integer
        role:
          type: string
      
    Global:
      required:
      #- code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Error:
      required:
      #- code
      - message
      type: object
      properties:
        #code:
        #  type: string
        message:
          type: string
          example: Authorization information is missing or invalid.
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    JWT:
      type: apiKey
      name: x-access-tokens
      in: header
