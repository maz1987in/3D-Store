paths:
  /address/:
    get:
      tags:
      - address
      summary: Get all shipping addresses for the current user
      operationId: getAllAddresses
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShippingAddress'
        401:
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - address
      summary: Add a new shipping address
      operationId: addAddress
      requestBody:
        description: Shipping address object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingAddressInput'
      responses:
        201:
          description: Address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address_id:
                    type: string
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
  /address/{id}:
    get:
      tags:
      - address
      summary: Get a shipping address by ID
      operationId: getAddressById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    $ref: '#/components/schemas/ShippingAddress'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - address
      summary: Update a shipping address
      operationId: updateAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Updated shipping address object
        required: true
        content:
          application/json:
            schema:
