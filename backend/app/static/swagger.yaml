        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
  /address/validate-shipping:
    post:
      tags:
      - address
      summary: Validate if products can be shipped to the address city
      operationId: validateShippingAddressForProducts
      requestBody:
        description: Address and product IDs to validate shipping availability
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: string
                  format: uuid
                product_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - address_id
              - product_ids
      responses:
        200:
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  unavailable_products:
                    type: array
                    items:
                      type: string
                  city:
                    type: string
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
