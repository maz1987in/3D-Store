      summary: Get All Cities
      description: Get all cities with optional filtering
      operationId: GetCities
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: per_page
        schema:
          type: integer
        description: Items per page
      - in: query
        name: sort_by
        schema:
          type: string
        description: Sort by field
      - in: query
        name: sort_order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort order
      - in: query
        name: queries
        schema:
          type: array
          items:
