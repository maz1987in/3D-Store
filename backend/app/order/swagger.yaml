openapi: 3.0.1
info:
  title: Store3d API
  description: This is a Store3d API document
  contact:
    email: info@store3d.om
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: https://store3d-api.example.com/store3d/api/v1
- url: /store3d/api/v1
security:
- basicAuth: []
- JWT: []
tags:
- name: order
  description: Operations about Order

paths:
  /orders/:
    get:
      tags:
      - order
      summary: Get All Orders
      description: Retrieve all orders with pagination and filtering.
      operationId: GetOrders
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
          description: Items per page
        - in: query
          name: sort
          schema:
            type: string
          description: Sort field
        - in: query
          name: sort_order
          schema:
            type: string
            enum:
              - asc
              - desc
          description: Sort order
        - in: query
          name: queries
          schema:
            type: array
            items:
              type: string
          description: Field, operator, value (e.g., `status,eq,Pending`)
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  filters:
                    $ref: '#/components/schemas/Filter'
        401:
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - order
      summary: Create Order
      description: Create a new order.
      operationId: CreateOrder
      requestBody:
        description: Create order object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store3dtOrder'
        required: true
      responses:
        201:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      tags:
      - order
      summary: Get Order by ID
      description: Retrieve a specific order by its ID.
      operationId: GetOrderById
      parameters:
      - name: id
        in: path
        description: The ID of the order to retrieve
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - order
      summary: Update Order
      description: Update an existing order.
      operationId: UpdateOrder
      parameters:
      - name: id
        in: path
        description: The ID of the order to update
        required: true
        schema:
          type: string
      requestBody:
        description: Updated order object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store3dtOrder'
        required: true
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - order
      summary: Delete Order
      description: Delete an order by its ID.
      operationId: DeleteOrder
      parameters:
      - name: id
        in: path
        description: The ID of the order to delete
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_date:
          type: string
          format: date-time
          description: Date the order was placed
        expected_delivery:
          type: string
          format: date-time
          description: Expected delivery date
        status:
          type: string
          enum:
            - Pending
            - Ordered
            - Received
            - Cancelled
          description: Status of the order
        total_amount:
          type: number
          format: float
          description: Total value of the order
        terms:
          type: string
          description: Payment terms (e.g., Net 30, Prepaid)
        notes:
          type: string
          description: Additional comments or internal notes
        supplier_id:
          type: string
          format: uuid
          description: ID of the supplier
        create_date:
          type: string
          format: date-time
          description: Date the order was created
        modified_date:
          type: string
          format: date-time
          description: Date the order was last modified
    Store3dtOrder:
      type: object
      properties:
        order_date:
          type: string
          format: date-time
          description: Date the order was placed
        expected_delivery:
          type: string
          format: date
          description: Expected delivery date
        status:
          type: string
          enum:
            - Pending
            - Ordered
            - Received
            - Cancelled
          description: Status of the order
        total_amount:
          type: number
          format: float
          description: Total value of the order
        terms:
          type: string
          description: Payment terms (e.g., Net 30, Prepaid)
        notes:
          type: string
          description: Additional comments or internal notes
        supplier_id:
          type: string
          format: uuid
          description: ID of the supplier
    Global:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Global'
