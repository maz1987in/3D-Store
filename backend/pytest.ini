[tool:pytest]
# Pytest configuration file

# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    api: API tests for HTTP endpoints
    database: Database tests for data operations
    slow: Slow running tests

# Test execution
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */test/*
    */venv/*
    */env/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */.*
    */conftest.py
    */setup.py
    */manage.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
